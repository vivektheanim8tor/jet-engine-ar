<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AeroCore AR - Image Tracking Scanner</title>
  
  <!-- A-Frame and MindAR for Image Tracking -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --glass-bg: rgba(15, 23, 42, 0.82);
      --glass-border: rgba(255, 255, 255, 0.16);
      --neon-cyan: #38bdf8;
      --neon-blue: #00f0ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* CRITICAL: html, body, and all background layers must be transparent */
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      background-color: transparent !important;
    }

    /* Video feed must be visible and placed directly behind the A-Frame 3D canvas */
    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 1 !important;
      pointer-events: none !important;
    }

    a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 2 !important;
      background: transparent !important;
      background-color: transparent !important;
    }

    .a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 2 !important;
      background: transparent !important;
      background-color: transparent !important;
    }

    /* Hide A-Frame default VR button & orientation modals that obstruct the view */
    .a-enter-vr, .a-enter-vr-button, .a-orientation-modal, .a-loader-title {
      display: none !important;
    }

    /* Fixed UI Layer */
    .ar-ui-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)) 16px;
    }

    /* Top Bar */
    .ar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      pointer-events: auto;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 20px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
      transition: all 0.3s ease;
    }

    .status-dot.active {
      background: #10b981;
      box-shadow: 0 0 12px #10b981;
    }

    /* Scanning Reticle Frame */
    .scan-reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 260px;
      height: 260px;
      border: 2px dashed rgba(56, 189, 248, 0.4);
      border-radius: 24px;
      pointer-events: none;
      transition: all 0.4s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scan-reticle.locked {
      border-color: #10b981;
      border-style: solid;
      transform: translate(-50%, -50%) scale(1.08);
      opacity: 0.15;
    }

    .scan-prompt {
      position: absolute;
      bottom: -36px;
      color: var(--neon-cyan);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      transition: opacity 0.3s;
    }

    /* Bottom Control Bar */
    .ar-bottom-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      pointer-events: auto;
    }

    .detected-title {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      padding: 6px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(10px);
    }

    .detected-title.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .control-row {
      display: flex;
      gap: 8px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 6px 12px;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .ar-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f5f9;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .ar-btn:active, .ar-btn.active {
      background: #38bdf8;
      color: #09090b;
      box-shadow: 0 0 14px #38bdf8;
    }
  </style>
</head>
<body>

  <!-- MindAR Scene with Multi-Target Tracking -->
  <a-scene
    mindar-image="imageTargetSrc: assets/targets.mind; autoStart: true; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="jetModel" src="assets/jet_engine.glb"></a-asset-item>
      <a-asset-item id="motorModel" src="assets/robot_motor.glb"></a-asset-item>
      <a-asset-item id="radialModel" src="assets/cylinder_engine.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Studio Lighting Setup -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.8;"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 2.5; position: 2 4 3;"></a-entity>
    <a-entity light="type: directional; color: #bae6fd; intensity: 1.5; position: -2 2 1;"></a-entity>
    <a-entity light="type: directional; color: #e2e8f0; intensity: 1.2; position: 0 -3 2;"></a-entity>

    <!-- Target 0: Turbofan Jet Engine -->
    <a-entity mindar-image-target="targetIndex: 0" id="target-jet">
      <!-- Container that moves along Z (rising through card plane at 100% final scale) -->
      <a-entity id="rise-container-0" position="0 0 0" scale="1 1 1">
        <a-gltf-model
          id="model-jet"
          src="#jetModel"
          rotation="90 0 0"
          position="0 0 0"
          scale="0.45 0.45 0.45">
        </a-gltf-model>
      </a-entity>
    </a-entity>

    <!-- Target 1: Festo Servo Drive Motor -->
    <a-entity mindar-image-target="targetIndex: 1" id="target-motor">
      <a-entity id="rise-container-1" position="0 0 0" scale="1 1 1">
        <a-gltf-model
          id="model-motor"
          src="#motorModel"
          rotation="90 0 0"
          position="0 0 0"
          scale="2.5 2.5 2.5">
        </a-gltf-model>
      </a-entity>
    </a-entity>

    <!-- Target 2: Gnome Omega 7-Cyl Radial Propeller Engine -->
    <a-entity mindar-image-target="targetIndex: 2" id="target-radial">
      <a-entity id="rise-container-2" position="0 0 0" scale="1 1 1">
        <a-gltf-model
          id="model-radial"
          src="#radialModel"
          rotation="90 0 0"
          position="0 0 0"
          scale="0.38 0.38 0.38">
        </a-gltf-model>
      </a-entity>
    </a-entity>

  </a-scene>

  <!-- AR Glass UI Overlay -->
  <div class="ar-ui-layer">
    <!-- Header -->
    <div class="ar-header">
      <a href="index.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        <span>Viewer</span>
      </a>

      <div class="status-badge">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Scanning Target</span>
      </div>
    </div>

    <!-- Center Scanning Target Frame -->
    <div class="scan-reticle" id="reticle">
      <div class="scan-prompt" id="scan-prompt">Point camera at photo</div>
    </div>

    <!-- Bottom Controls -->
    <div class="ar-bottom-controls">
      <div class="detected-title" id="detected-title">Target Detected</div>

      <div class="control-row">
        <button class="ar-btn active" id="btn-ar-assemble" onclick="handleAssemble()">
          <span>Assemble</span>
        </button>

        <button class="ar-btn" id="btn-ar-explode" onclick="handleExplode()">
          <span>Explode</span>
        </button>

        <button class="ar-btn" id="btn-ar-spin" onclick="handleSpin()">
          <span>Spin</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Exact targets configuration with submerse depth and resting elevation
    const targets = [
      {
        name: "AeroCore Turbofan",
        containerId: "rise-container-0",
        targetId: "target-jet",
        modelId: "model-jet",
        submerseZ: -0.65,      // Submerged depth below plane
        finalZ: 0.12,          // Elevation above card when fully emerged
        explodeDuration: 4.0,  // Animation clip duration
        explodeTargetTime: 2.16
      },
      {
        name: "Festo Servo Motor",
        containerId: "rise-container-1",
        targetId: "target-motor",
        modelId: "model-motor",
        submerseZ: -0.45,
        finalZ: 0.10,
        explodeDuration: 4.0,
        explodeTargetTime: 2.16
      },
      {
        name: "Gnome 7-Cyl Rotary",
        containerId: "rise-container-2",
        targetId: "target-radial",
        modelId: "model-radial",
        submerseZ: -0.55,
        finalZ: 0.12,
        explodeDuration: 4.0,
        explodeTargetTime: (70.0 / 120.0) * 4.0 // 2.33s for 100% radial explosion
      }
    ];

    let currentTargetIdx = -1;
    let isExploded = false;
    let isSpinning = false;
    let mixers = {};
    let actions = {};
    let clipPlanes = {};

    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const reticle = document.getElementById('reticle');
    const scanPrompt = document.getElementById('scan-prompt');
    const detectedTitle = document.getElementById('detected-title');

    // MindAR & Three.js Studio Material & Clipping Setup Component
    AFRAME.registerComponent('ar-master-controller', {
      init: function () {
        const sceneEl = this.el;
        const renderer = sceneEl.renderer;
        const threeScene = sceneEl.object3D;

        // 1. Enable Hardware Local Clipping Plane
        renderer.localClippingEnabled = true;

        // 2. Set Professional Color Management & ACES Filmic Tone Mapping (matches Model Viewer)
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.35;
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        // 3. Generate Studio HDRI Environment Map for realistic PBR metallic reflections
        try {
          const pmremGenerator = new THREE.PMREMGenerator(renderer);
          pmremGenerator.compileEquirectangularShader();

          const envScene = new THREE.Scene();
          const lightTop = new THREE.DirectionalLight(0xffffff, 2.5);
          lightTop.position.set(0, 5, 2);
          envScene.add(lightTop);

          const lightFront = new THREE.DirectionalLight(0xffffff, 2.0);
          lightFront.position.set(0, 0, 5);
          envScene.add(lightFront);

          const lightRim = new THREE.DirectionalLight(0x7dd3fc, 1.8);
          lightRim.position.set(-4, -2, -3);
          envScene.add(lightRim);

          const hemi = new THREE.HemisphereLight(0xffffff, 0x334155, 2.0);
          envScene.add(hemi);

          const envRenderTarget = pmremGenerator.fromScene(envScene, 0.04);
          threeScene.environment = envRenderTarget.texture;
        } catch (e) {
          console.warn("HDR PMREM Environment Map creation skipped:", e);
        }

        // 4. Enforce visible video feed element
        const fixVideo = () => {
          const video = document.querySelector('video');
          if (video) {
            video.setAttribute('playsinline', '');
            video.setAttribute('webkit-playsinline', '');
            video.muted = true;
            video.style.position = 'fixed';
            video.style.top = '0px';
            video.style.left = '0px';
            video.style.width = '100vw';
            video.style.height = '100vh';
            video.style.objectFit = 'cover';
            video.style.zIndex = '1';
            video.style.display = 'block';
            video.style.visibility = 'visible';
            video.style.opacity = '1';
            if (video.paused) {
              video.play().catch(e => console.log('Video play error:', e));
            }
          }
        };

        sceneEl.addEventListener('arReady', fixVideo);
        setInterval(fixVideo, 500);

        // 5. Initialize Models: Apply Local Surface Clipping Plane & Setup AnimationMixers
        targets.forEach((t, idx) => {
          const modelEl = document.getElementById(t.modelId);
          const targetEl = document.getElementById(t.targetId);
          const containerEl = document.getElementById(t.containerId);

          // Initially submerge container below card surface so it emerges from below
          containerEl.setAttribute('position', `0 0 ${t.submerseZ}`);
          containerEl.setAttribute('scale', '1 1 1');

          // Local clipping plane at Z=0 of target card (normal points +Z outwards from card)
          // Any geometry where (normal . P + constant) >= 0 is RENDERED (above card).
          // Geometry below card plane (Z < 0) is CUT OFF / SUBTRACTED cleanly.
          const localPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
          const worldPlane = new THREE.Plane();
          clipPlanes[t.modelId] = {
            targetObj: targetEl.object3D,
            localPlane: localPlane,
            worldPlane: worldPlane,
            normalMatrix: new THREE.Matrix3()
          };

          modelEl.addEventListener('model-loaded', () => {
            const mesh = modelEl.getObject3D('mesh');
            if (!mesh) return;

            // Apply clipping plane and enhance material PBR fidelity
            mesh.traverse(child => {
              if (child.isMesh && child.material) {
                child.material.clippingPlanes = [worldPlane];
                child.material.clipShadows = true;
                child.material.needsUpdate = true;

                // Ensure textures render with proper color space
                if (child.material.map) {
                  child.material.map.colorSpace = THREE.SRGBColorSpace;
                  child.material.map.needsUpdate = true;
                }
                if (child.material.roughnessMap) {
                  child.material.roughnessMap.colorSpace = THREE.NoColorSpace;
                }
                if (child.material.metalnessMap) {
                  child.material.metalnessMap.colorSpace = THREE.NoColorSpace;
                }
              }
            });

            // Initialize Three.js AnimationMixer with GLB embedded tracks
            if (mesh.animations && mesh.animations.length > 0) {
              const mixer = new THREE.AnimationMixer(mesh);
              mixers[t.modelId] = mixer;
              actions[t.modelId] = {};

              mesh.animations.forEach(clip => {
                const action = mixer.clipAction(clip);
                action.play();
                action.paused = true; // Controlled by seek time
                actions[t.modelId][clip.name] = action;
              });

              // Initial frame: Assembled at t=0
              seekAnimation(t.modelId, 'Explode_Assembly', 0);
            }
          });
        });
      },

      tick: function (t, dt) {
        const delta = dt * 0.001; // seconds

        // Update clipping planes to follow active tracking targets in world coordinates
        Object.keys(clipPlanes).forEach(id => {
          const cp = clipPlanes[id];
          if (cp.targetObj && cp.targetObj.matrixWorld.determinant() !== 0) {
            cp.normalMatrix.getNormalMatrix(cp.targetObj.matrixWorld);
            cp.worldPlane.copy(cp.localPlane).applyMatrix4(cp.targetObj.matrixWorld, cp.normalMatrix);
          }
        });

        // Update AnimationMixer ticks
        if (currentTargetIdx >= 0) {
          const currentTarget = targets[currentTargetIdx];
          const mixer = mixers[currentTarget.modelId];
          const actObj = actions[currentTarget.modelId];

          if (isSpinning && actObj) {
            // Spin animation
            if (currentTarget.modelId === 'model-radial' && actObj['Blade_Rotation']) {
              // Radial engine has dedicated propeller rotation track
              const bladeAct = actObj['Blade_Rotation'];
              bladeAct.paused = false;
              mixer.update(delta * 1.5);
            } else {
              // Continuous yaw rotation for Turbofan & Motor
              const mEl = document.getElementById(currentTarget.modelId);
              if (mEl) {
                const rot = mEl.getAttribute('rotation') || { x: 90, y: 0, z: 0 };
                rot.y = (rot.y + (dt * 0.12)) % 360;
                mEl.setAttribute('rotation', rot);
              }
            }
          }
        }
      }
    });

    document.querySelector('a-scene').setAttribute('ar-master-controller', '');

    // Register Target Found / Lost Events for all 3 targets
    targets.forEach((t, idx) => {
      const el = document.getElementById(t.targetId);
      if (!el) return;

      el.addEventListener('targetFound', () => {
        currentTargetIdx = idx;
        statusDot.classList.add('active');
        statusText.innerText = "Tracking Locked";
        reticle.classList.add('locked');
        scanPrompt.style.opacity = '0';
        detectedTitle.innerText = t.name;
        detectedTitle.classList.add('visible');

        // Reset Assembly state to Assembled
        isExploded = false;
        document.getElementById('btn-ar-assemble').classList.add('active');
        document.getElementById('btn-ar-explode').classList.remove('active');
        seekAnimation(t.modelId, 'Explode_Assembly', 0);

        // Trigger Surface Pop-up: Model emerges upwards through the card surface with physical clipping!
        animateEmergenceFromSurface(t.containerId, t.submerseZ, t.finalZ);
      });

      el.addEventListener('targetLost', () => {
        if (currentTargetIdx === idx) {
          statusDot.classList.remove('active');
          statusText.innerText = "Scanning Target";
          reticle.classList.remove('locked');
          scanPrompt.style.opacity = '1';
          detectedTitle.classList.remove('visible');
        }
      });
    });

    /**
     * Surface Emergence Animation
     * Rises from submerged depth Z = submerseZ up through card plane to Z = finalZ.
     * The scale remains locked at 1.0 (final size), and parts below Z=0 are clipped by the card surface!
     */
    function animateEmergenceFromSurface(containerId, startZ, endZ) {
      const el = document.getElementById(containerId);
      if (!el) return;

      let startTime = performance.now();
      const duration = 1400; // ms

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / duration);

        // Smooth cubic ease out with slight overshoot
        const c1 = 1.0;
        const c3 = c1 + 1;
        const ease = 1 + c3 * Math.pow(progress - 1, 3) + c1 * Math.pow(progress - 1, 2);

        const currentZ = startZ + (endZ - startZ) * ease;
        el.setAttribute('position', `0 0 ${currentZ.toFixed(4)}`);

        if (progress < 1) {
          requestAnimationFrame(step);
        }
      }
      requestAnimationFrame(step);
    }

    // Seek GLB Animation Action by normalized progress (0.0 = assembled, 1.0 = exploded)
    function seekAnimation(modelId, clipName, progress) {
      const actObj = actions[modelId];
      if (!actObj || !actObj[clipName]) return;

      const action = actObj[clipName];
      const t = targets.find(item => item.modelId === modelId);
      if (!t) return;

      const targetTime = progress * t.explodeTargetTime;
      action.paused = true;
      action.time = Math.max(0, Math.min(action.getClip().duration, targetTime));
      
      const mixer = mixers[modelId];
      if (mixer) mixer.update(0);
    }

    // Smooth Assembly / Explosion Transition using true GLB keyframe tracks
    function animateExplosionState(modelId, fromProgress, toProgress) {
      let startTime = performance.now();
      const duration = 750; // ms

      function step(now) {
        const elapsed = now - startTime;
        const p = Math.min(1, elapsed / duration);
        const ease = 0.5 - Math.cos(p * Math.PI) / 2; // smooth cosine ease
        const currentProgress = fromProgress + (toProgress - fromProgress) * ease;

        seekAnimation(modelId, 'Explode_Assembly', currentProgress);

        if (p < 1) {
          requestAnimationFrame(step);
        }
      }
      requestAnimationFrame(step);
    }

    // Button Handlers
    function handleAssemble() {
      if (currentTargetIdx < 0) return;
      isExploded = false;
      document.getElementById('btn-ar-assemble').classList.add('active');
      document.getElementById('btn-ar-explode').classList.remove('active');

      const t = targets[currentTargetIdx];
      animateExplosionState(t.modelId, 1.0, 0.0);
    }

    function handleExplode() {
      if (currentTargetIdx < 0) return;
      isExploded = true;
      document.getElementById('btn-ar-explode').classList.add('active');
      document.getElementById('btn-ar-assemble').classList.remove('active');

      const t = targets[currentTargetIdx];
      animateExplosionState(t.modelId, 0.0, 1.0);
    }

    function handleSpin() {
      if (currentTargetIdx < 0) return;
      isSpinning = !isSpinning;
      const btn = document.getElementById('btn-ar-spin');
      btn.classList.toggle('active', isSpinning);

      const t = targets[currentTargetIdx];
      if (!isSpinning && t.modelId === 'model-radial') {
        const actObj = actions[t.modelId];
        if (actObj && actObj['Blade_Rotation']) {
          actObj['Blade_Rotation'].paused = true;
        }
      }
    }
  </script>
</body>
</html>
