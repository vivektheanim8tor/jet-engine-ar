<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AeroCore AR - Image Tracking Scanner</title>
  
  <!-- A-Frame and MindAR for Image Tracking -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --glass-bg: rgba(15, 23, 42, 0.85);
      --glass-border: rgba(255, 255, 255, 0.18);
      --neon-cyan: #38bdf8;
      --neon-blue: #00f0ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* CRITICAL: html, body, and all background layers must be transparent */
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      background-color: transparent !important;
    }

    /* Video feed must be visible and placed directly behind the A-Frame 3D canvas */
    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 1 !important;
      pointer-events: none !important;
    }

    a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 2 !important;
      background: transparent !important;
      background-color: transparent !important;
    }

    .a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 2 !important;
      background: transparent !important;
      background-color: transparent !important;
    }

    /* Hide A-Frame default VR button & orientation modals that obstruct the view */
    .a-enter-vr, .a-enter-vr-button, .a-orientation-modal, .a-loader-title {
      display: none !important;
    }

    /* Fixed UI Layer */
    .ar-ui-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)) 16px;
    }

    /* Top Bar */
    .ar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      pointer-events: auto;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .glass-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 20px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .glass-btn:active {
      transform: scale(0.96);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
      transition: all 0.3s ease;
    }

    .status-dot.active {
      background: #10b981;
      box-shadow: 0 0 12px #10b981;
    }

    /* Scanning Reticle Frame */
    .scan-reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 260px;
      height: 260px;
      border: 2px dashed rgba(56, 189, 248, 0.4);
      border-radius: 24px;
      pointer-events: none;
      transition: all 0.4s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scan-reticle.locked {
      border-color: #10b981;
      border-style: solid;
      transform: translate(-50%, -50%) scale(1.08);
      opacity: 0.15;
    }

    .scan-prompt {
      position: absolute;
      bottom: -36px;
      color: var(--neon-cyan);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      transition: opacity 0.3s;
    }

    /* Bottom Control Bar */
    .ar-bottom-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      pointer-events: auto;
    }

    .detected-title {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      padding: 6px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(10px);
    }

    .detected-title.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .control-row {
      display: flex;
      gap: 8px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 6px 12px;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .ar-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f5f9;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .ar-btn:active, .ar-btn.active {
      background: #38bdf8;
      color: #09090b;
      box-shadow: 0 0 14px #38bdf8;
    }
  </style>
</head>
<body>

  <!-- MindAR Scene with Multi-Target Tracking -->
  <a-scene
    mindar-image="imageTargetSrc: assets/targets.mind; autoStart: true; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="jetModel" src="assets/jet_engine.glb"></a-asset-item>
      <a-asset-item id="motorModel" src="assets/robot_motor.glb"></a-asset-item>
      <a-asset-item id="radialModel" src="assets/cylinder_engine.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Balanced Photorealistic Studio Lights -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.4;"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 2.2; position: 2 4 3;"></a-entity>
    <a-entity light="type: directional; color: #bae6fd; intensity: 1.6; position: -2 2 1;"></a-entity>
    <a-entity light="type: directional; color: #f1f5f9; intensity: 1.2; position: 0 -3 2;"></a-entity>

    <!-- Target 0: Turbofan Jet Engine -->
    <a-entity mindar-image-target="targetIndex: 0" id="target-jet">
      <a-entity id="rise-container-0" position="0 0 0" scale="1 1 1">
        <a-gltf-model
          id="model-jet"
          src="#jetModel"
          rotation="90 0 0"
          position="0 0 0"
          scale="0.45 0.45 0.45">
        </a-gltf-model>
      </a-entity>
    </a-entity>

    <!-- Target 1: Festo Servo Drive Motor -->
    <a-entity mindar-image-target="targetIndex: 1" id="target-motor">
      <a-entity id="rise-container-1" position="0 0 0" scale="1 1 1">
        <a-gltf-model
          id="model-motor"
          src="#motorModel"
          rotation="90 0 0"
          position="0 0 0"
          scale="2.5 2.5 2.5">
        </a-gltf-model>
      </a-entity>
    </a-entity>

    <!-- Target 2: Gnome Omega 7-Cyl Radial Propeller Engine -->
    <a-entity mindar-image-target="targetIndex: 2" id="target-radial">
      <a-entity id="rise-container-2" position="0 0 0" scale="1 1 1">
        <a-gltf-model
          id="model-radial"
          src="#radialModel"
          rotation="90 0 0"
          position="0 0 0"
          scale="0.38 0.38 0.38">
        </a-gltf-model>
      </a-entity>
    </a-entity>

  </a-scene>

  <!-- AR Glass UI Overlay -->
  <div class="ar-ui-layer">
    <!-- Header -->
    <div class="ar-header">
      <div class="header-actions">
        <a href="index.html" class="glass-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
          <span>Viewer</span>
        </a>
        <button class="glass-btn" onclick="resetARScan()" title="Reset and re-run entrance animation">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          <span>Re-run</span>
        </button>
      </div>

      <div class="status-badge">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Scanning Target</span>
      </div>
    </div>

    <!-- Center Scanning Target Frame -->
    <div class="scan-reticle" id="reticle">
      <div class="scan-prompt" id="scan-prompt">Point camera at photo</div>
    </div>

    <!-- Bottom Controls -->
    <div class="ar-bottom-controls">
      <div class="detected-title" id="detected-title">Target Detected</div>

      <div class="control-row">
        <button class="ar-btn active" id="btn-ar-assemble" onclick="handleAssemble()">
          <span>Assemble</span>
        </button>

        <button class="ar-btn" id="btn-ar-explode" onclick="handleExplode()">
          <span>Explode</span>
        </button>

        <button class="ar-btn" id="btn-ar-spin" onclick="handleSpin()">
          <span>Spin</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Targets configuration
    const targets = [
      {
        name: "AeroCore Turbofan",
        containerId: "rise-container-0",
        targetId: "target-jet",
        modelId: "model-jet",
        submerseZ: -0.65,      // Submerged depth below card surface
        finalZ: 0.12,          // Resting elevation above card
        explodeDuration: 4.0,
        explodeTargetTime: 2.16,
        hasEmerged: false,     // Locks state once emerged so it never re-triggers or glitches
        isEmerging: false
      },
      {
        name: "Festo Servo Motor",
        containerId: "rise-container-1",
        targetId: "target-motor",
        modelId: "model-motor",
        submerseZ: -0.45,
        finalZ: 0.10,
        explodeDuration: 4.0,
        explodeTargetTime: 2.16,
        hasEmerged: false,
        isEmerging: false
      },
      {
        name: "Gnome 7-Cyl Rotary",
        containerId: "rise-container-2",
        targetId: "target-radial",
        modelId: "model-radial",
        submerseZ: -0.55,
        finalZ: 0.12,
        explodeDuration: 4.0,
        explodeTargetTime: (70.0 / 120.0) * 4.0,
        hasEmerged: false,
        isEmerging: false
      }
    ];

    let currentTargetIdx = -1;
    let isExploded = false;
    let isSpinning = false;
    let mixers = {};
    let actions = {};
    let clipPlanes = {};

    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const reticle = document.getElementById('reticle');
    const scanPrompt = document.getElementById('scan-prompt');
    const detectedTitle = document.getElementById('detected-title');

    // Setup High-Fidelity Studio Environment Map
    function createStudioEnvironment(renderer, threeScene) {
      // Create a smooth, bright equirectangular studio environment canvas
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // Soft vertical studio gradient (sky to floor)
      const grad = ctx.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0.0, '#ffffff'); // bright ceiling
      grad.addColorStop(0.3, '#f1f5f9'); // soft white upper
      grad.addColorStop(0.5, '#e2e8f0'); // neutral horizon
      grad.addColorStop(0.7, '#cbd5e1'); // soft floor
      grad.addColorStop(1.0, '#94a3b8'); // base
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 256);

      // Studio softboxes / light panels for realistic metallic highlights
      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.fillRect(60, 30, 90, 110);
      ctx.fillRect(360, 30, 90, 110);
      ctx.fillRect(210, 15, 90, 80);

      const texture = new THREE.CanvasTexture(canvas);
      texture.mapping = THREE.EquirectangularReflectionMapping;
      texture.colorSpace = THREE.SRGBColorSpace;

      threeScene.environment = texture;
    }

    AFRAME.registerComponent('ar-master-controller', {
      init: function () {
        const sceneEl = this.el;
        const renderer = sceneEl.renderer;
        const threeScene = sceneEl.object3D;

        // 1. Enable Hardware Local Clipping Plane
        renderer.localClippingEnabled = true;

        // 2. Set ACES Filmic Tone Mapping and Exposure
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.35;
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        // 3. Generate Studio Reflection Environment Texture
        createStudioEnvironment(renderer, threeScene);

        // 4. Ensure camera video feed plays inline and is visible
        const fixVideo = () => {
          const video = document.querySelector('video');
          if (video) {
            video.setAttribute('playsinline', '');
            video.setAttribute('webkit-playsinline', '');
            video.muted = true;
            video.style.position = 'fixed';
            video.style.top = '0px';
            video.style.left = '0px';
            video.style.width = '100vw';
            video.style.height = '100vh';
            video.style.objectFit = 'cover';
            video.style.zIndex = '1';
            video.style.display = 'block';
            video.style.visibility = 'visible';
            video.style.opacity = '1';
            if (video.paused) {
              video.play().catch(e => console.log('Video play error:', e));
            }
          }
        };

        sceneEl.addEventListener('arReady', fixVideo);
        setInterval(fixVideo, 500);

        // 5. Initialize Models & Clipping Setup
        targets.forEach((t, idx) => {
          const modelEl = document.getElementById(t.modelId);
          const targetEl = document.getElementById(t.targetId);
          const containerEl = document.getElementById(t.containerId);

          // Submerge model below card surface initially
          containerEl.setAttribute('position', `0 0 ${t.submerseZ}`);
          containerEl.setAttribute('scale', '1 1 1');

          // Target card surface plane:
          const worldPlane = new THREE.Plane();
          clipPlanes[t.modelId] = {
            targetObj: targetEl.object3D,
            worldPlane: worldPlane,
            active: true
          };

          modelEl.addEventListener('model-loaded', () => {
            const mesh = modelEl.getObject3D('mesh');
            if (!mesh) return;

            // Apply double-side and attach active clipping plane
            mesh.traverse(child => {
              if (child.isMesh && child.material) {
                child.material.side = THREE.DoubleSide; // Render both sides cleanly when sliced
                child.material.clippingPlanes = [worldPlane];
                child.material.clipShadows = true;

                // Ensure metalness and roughness textures are evaluated correctly
                if (child.material.map) {
                  child.material.map.colorSpace = THREE.SRGBColorSpace;
                }
                child.material.envMapIntensity = 1.25;
                child.material.needsUpdate = true;
              }
            });

            // Initialize Three.js AnimationMixer with GLB embedded tracks
            if (mesh.animations && mesh.animations.length > 0) {
              const mixer = new THREE.AnimationMixer(mesh);
              mixers[t.modelId] = mixer;
              actions[t.modelId] = {};

              mesh.animations.forEach(clip => {
                const action = mixer.clipAction(clip);
                action.play();
                action.paused = true;
                actions[t.modelId][clip.name] = action;
              });

              seekAnimation(t.modelId, 'Explode_Assembly', 0);
            }
          });
        });
      },

      tick: function (t, dt) {
        const delta = dt * 0.001; // seconds

        // Update clipping planes to follow active tracking targets in world space
        Object.keys(clipPlanes).forEach(id => {
          const cp = clipPlanes[id];
          if (cp.active && cp.targetObj && cp.targetObj.matrixWorld) {
            // Check matrixWorld determinant: non-zero means target is actively tracked
            const m = cp.targetObj.matrixWorld;
            if (m.determinant() !== 0) {
              // Target plane normal in local target space is (0, 0, 1) pointing out of card
              const normal = new THREE.Vector3(0, 0, 1).transformDirection(m).normalize();
              const pointOnPlane = new THREE.Vector3(0, 0, 0).applyMatrix4(m);
              cp.worldPlane.setFromNormalAndCoplanarPoint(normal, pointOnPlane);
            }
          }
        });

        // Update AnimationMixer ticks
        if (currentTargetIdx >= 0) {
          const currentTarget = targets[currentTargetIdx];
          const mixer = mixers[currentTarget.modelId];
          const actObj = actions[currentTarget.modelId];

          if (isSpinning && actObj) {
            if (currentTarget.modelId === 'model-radial' && actObj['Blade_Rotation']) {
              const bladeAct = actObj['Blade_Rotation'];
              bladeAct.paused = false;
              mixer.update(delta * 1.5);
            } else {
              const mEl = document.getElementById(currentTarget.modelId);
              if (mEl) {
                const rot = mEl.getAttribute('rotation') || { x: 90, y: 0, z: 0 };
                rot.y = (rot.y + (dt * 0.12)) % 360;
                mEl.setAttribute('rotation', rot);
              }
            }
          }
        }
      }
    });

    document.querySelector('a-scene').setAttribute('ar-master-controller', '');

    // Register Target Found / Lost Events
    targets.forEach((t, idx) => {
      const el = document.getElementById(t.targetId);
      if (!el) return;

      el.addEventListener('targetFound', () => {
        currentTargetIdx = idx;
        statusDot.classList.add('active');
        statusText.innerText = "Tracking Locked";
        reticle.classList.add('locked');
        scanPrompt.style.opacity = '0';
        detectedTitle.innerText = t.name;
        detectedTitle.classList.add('visible');

        // ONE-SHOT BEHAVIOR:
        // Only trigger the slow surface emergence ONCE per session.
        // If already emerged, do NOT re-trigger or glitch when seen again!
        if (!t.hasEmerged && !t.isEmerging) {
          t.isEmerging = true;
          isExploded = false;
          document.getElementById('btn-ar-assemble').classList.add('active');
          document.getElementById('btn-ar-explode').classList.remove('active');
          seekAnimation(t.modelId, 'Explode_Assembly', 0);

          // Emerges slowly from the card surface over 2.6 seconds
          animateEmergenceFromSurface(t, t.containerId, t.submerseZ, t.finalZ, 2600);
        }
      });

      el.addEventListener('targetLost', () => {
        if (currentTargetIdx === idx) {
          statusDot.classList.remove('active');
          statusText.innerText = "Scanning Target";
          reticle.classList.remove('locked');
          scanPrompt.style.opacity = '1';
        }
      });
    });

    /**
     * Slow Surface Emergence Animation
     * Rises from submerged depth up through the card plane with active physical clipping.
     * When finished:
     * - Remembers hasEmerged = true
     * - Disables clipping planes completely so the model never interacts with clipping again!
     */
    function animateEmergenceFromSurface(targetData, containerId, startZ, endZ, duration) {
      const el = document.getElementById(containerId);
      if (!el) return;

      let startTime = performance.now();

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / duration);

        // Smooth sinusoidal ease out
        const ease = Math.sin((progress * Math.PI) / 2);
        const currentZ = startZ + (endZ - startZ) * ease;

        el.setAttribute('position', `0 0 ${currentZ.toFixed(4)}`);

        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          // Model has fully emerged!
          targetData.isEmerging = false;
          targetData.hasEmerged = true;
          el.setAttribute('position', `0 0 ${endZ.toFixed(4)}`);

          // Completely detach and disable clipping plane on all materials
          removeClippingPlanes(targetData.modelId);
        }
      }
      requestAnimationFrame(step);
    }

    // Disables clipping plane on model so it never clips or interacts with the surface again
    function removeClippingPlanes(modelId) {
      const cp = clipPlanes[modelId];
      if (cp) cp.active = false;

      const modelEl = document.getElementById(modelId);
      if (!modelEl) return;
      const mesh = modelEl.getObject3D('mesh');
      if (!mesh) return;

      mesh.traverse(child => {
        if (child.isMesh && child.material) {
          child.material.clippingPlanes = [];
          child.material.needsUpdate = true;
        }
      });
    }

    // Re-attach clipping plane when resetting / re-running
    function reattachClippingPlanes(modelId) {
      const cp = clipPlanes[modelId];
      if (cp) cp.active = true;

      const modelEl = document.getElementById(modelId);
      if (!modelEl) return;
      const mesh = modelEl.getObject3D('mesh');
      if (!mesh) return;

      mesh.traverse(child => {
        if (child.isMesh && child.material && cp) {
          child.material.clippingPlanes = [cp.worldPlane];
          child.material.needsUpdate = true;
        }
      });
    }

    // Reset & Re-run function
    function resetARScan() {
      targets.forEach(t => {
        t.hasEmerged = false;
        t.isEmerging = false;
        const container = document.getElementById(t.containerId);
        if (container) {
          container.setAttribute('position', `0 0 ${t.submerseZ}`);
        }
        reattachClippingPlanes(t.modelId);
        seekAnimation(t.modelId, 'Explode_Assembly', 0);
      });

      isExploded = false;
      isSpinning = false;
      document.getElementById('btn-ar-assemble').classList.add('active');
      document.getElementById('btn-ar-explode').classList.remove('active');
      document.getElementById('btn-ar-spin').classList.remove('active');

      if (currentTargetIdx >= 0) {
        const current = targets[currentTargetIdx];
        current.isEmerging = true;
        animateEmergenceFromSurface(current, current.containerId, current.submerseZ, current.finalZ, 2600);
      }
    }

    // Seek GLB Animation Action by normalized progress (0.0 = assembled, 1.0 = exploded)
    function seekAnimation(modelId, clipName, progress) {
      const actObj = actions[modelId];
      if (!actObj || !actObj[clipName]) return;

      const action = actObj[clipName];
      const t = targets.find(item => item.modelId === modelId);
      if (!t) return;

      const targetTime = progress * t.explodeTargetTime;
      action.paused = true;
      action.time = Math.max(0, Math.min(action.getClip().duration, targetTime));
      
      const mixer = mixers[modelId];
      if (mixer) mixer.update(0);
    }

    // Smooth Assembly / Explosion Transition
    function animateExplosionState(modelId, fromProgress, toProgress) {
      let startTime = performance.now();
      const duration = 750; // ms

      function step(now) {
        const elapsed = now - startTime;
        const p = Math.min(1, elapsed / duration);
        const ease = 0.5 - Math.cos(p * Math.PI) / 2;
        const currentProgress = fromProgress + (toProgress - fromProgress) * ease;

        seekAnimation(modelId, 'Explode_Assembly', currentProgress);

        if (p < 1) {
          requestAnimationFrame(step);
        }
      }
      requestAnimationFrame(step);
    }

    // Button Handlers
    function handleAssemble() {
      if (currentTargetIdx < 0) return;
      isExploded = false;
      document.getElementById('btn-ar-assemble').classList.add('active');
      document.getElementById('btn-ar-explode').classList.remove('active');

      const t = targets[currentTargetIdx];
      animateExplosionState(t.modelId, 1.0, 0.0);
    }

    function handleExplode() {
      if (currentTargetIdx < 0) return;
      isExploded = true;
      document.getElementById('btn-ar-explode').classList.add('active');
      document.getElementById('btn-ar-assemble').classList.remove('active');

      const t = targets[currentTargetIdx];
      animateExplosionState(t.modelId, 0.0, 1.0);
    }

    function handleSpin() {
      if (currentTargetIdx < 0) return;
      isSpinning = !isSpinning;
      const btn = document.getElementById('btn-ar-spin');
      btn.classList.toggle('active', isSpinning);

      const t = targets[currentTargetIdx];
      if (!isSpinning && t.modelId === 'model-radial') {
        const actObj = actions[t.modelId];
        if (actObj && actObj['Blade_Rotation']) {
          actObj['Blade_Rotation'].paused = true;
        }
      }
    }
  </script>
</body>
