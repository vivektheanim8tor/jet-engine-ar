<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AeroCore & Festo AR Suite - Interactive Engineering Data</title>
  <!-- Google model-viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    :root {
      --glass-bg: rgba(20, 20, 24, 0.75);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-border-hover: rgba(255, 255, 255, 0.3);
      --accent: #f5f5f7;
      --accent-muted: #94a3b8;
      --accent-active: #ffffff;
      --active-bg: rgba(255, 255, 255, 0.18);
      --blur: blur(28px) saturate(190%);
      --radius-lg: 24px;
      --radius-md: 14px;
      --cyan: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #09090b;
      color: #ededed;
    }

    .viewport-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 35%, #18181f 0%, #09090b 100%);
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      outline: none;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--glass-border);
      box-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.45), inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
    }

    /* Top Navigation Bar */
    .top-bar {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }

    .model-selector {
      pointer-events: auto;
      border-radius: var(--radius-lg);
      padding: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .selector-tab {
      background: transparent;
      border: none;
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--accent-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .selector-tab svg { width: 14px; height: 14px; stroke: currentColor; fill: none; }
    .selector-tab:hover { color: var(--accent); }
    .selector-tab.active {
      background: var(--active-bg);
      color: var(--accent-active);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .glass-btn-icon {
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-btn-icon:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--glass-border-hover);
      transform: scale(1.04);
    }

    .glass-btn-icon.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .glass-btn-ar {
      border-radius: 24px;
      padding: 0 18px;
      height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--accent);
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-btn-ar:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--glass-border-hover);
      transform: scale(1.02);
    }

    /* Left Specs HUD Card */
    .specs-card {
      position: absolute;
      top: 80px;
      left: 20px;
      width: 250px;
      border-radius: 18px;
      padding: 16px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: opacity 0.3s ease;
    }

    .specs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 8px;
    }

    .specs-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #38bdf8;
    }

    .specs-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 500;
      color: #34d399;
    }

    .status-ping {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
    }

    .specs-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .spec-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
    }

    .spec-key { color: var(--accent-muted); font-size: 11px; }
    .spec-val { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }

    /* --- ENGINEERING 3D CALLOUT ANCHOR WITH CONNECTING LEADER LINE --- */
    .callout-anchor {
      position: relative;
      cursor: pointer;
      display: block;
      outline: none;
      border: none;
      background: transparent;
      padding: 0;
      pointer-events: auto;
    }

    /* Pulse dot on model surface */
    .callout-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px #38bdf8, 0 0 20px rgba(56, 189, 248, 0.8);
      border: 2px solid #ffffff;
      animation: calloutPulse 2s infinite ease-in-out;
    }

    @keyframes calloutPulse {
      0% { transform: scale(0.9); box-shadow: 0 0 6px #38bdf8; }
      50% { transform: scale(1.3); box-shadow: 0 0 16px #38bdf8, 0 0 28px rgba(56, 189, 248, 0.6); }
      100% { transform: scale(0.9); box-shadow: 0 0 6px #38bdf8; }
    }

    /* Angled leader line extending out from the dot */
    .callout-line {
      position: absolute;
      top: 6px;
      left: 10px;
      width: 44px;
      height: 32px;
      pointer-events: none;
      stroke: #38bdf8;
      stroke-width: 1.5;
      fill: none;
      filter: drop-shadow(0 0 3px rgba(56, 189, 248, 0.5));
    }

    /* Floating callout label tag */
    .callout-tag {
      position: absolute;
      top: -38px;
      left: 48px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 8px;
      padding: 5px 10px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .callout-anchor:hover .callout-tag {
      transform: translateY(-2px);
      border-color: #38bdf8;
      background: rgba(2, 132, 199, 0.95);
    }

    .callout-num {
      font-size: 10px;
      font-weight: 700;
      color: #09090b;
      background: #38bdf8;
      border-radius: 4px;
      padding: 1px 5px;
    }

    .callout-anchor:hover .callout-num {
      background: #ffffff;
      color: #0284c7;
    }

    .callout-text {
      font-size: 11px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.02em;
    }

    /* Right Details Flyout Drawer */
    .info-flyout {
      position: absolute;
      top: 80px;
      right: 20px;
      width: 320px;
      border-radius: 20px;
      padding: 18px 20px;
      z-index: 20;
      display: none;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6);
      animation: flyoutSlide 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .info-flyout.active { display: flex; }

    @keyframes flyoutSlide {
      from { opacity: 0; transform: translateX(12px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .info-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .info-category {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 3px;
    }

    .info-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
    }

    .info-close {
      background: none;
      border: none;
      color: var(--accent-muted);
      cursor: pointer;
      padding: 4px;
    }

    .info-close:hover { color: var(--accent); }

    .info-body {
      font-size: 12px;
      line-height: 1.55;
      color: #cbd5e1;
    }

    .info-spec-list {
      margin-top: 4px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
    }

    .info-row span:first-child { color: var(--accent-muted); }
    .info-row span:last-child { color: #f8fafc; font-weight: 600; }

    /* Bottom Control Floating Island */
    .bottom-island {
      position: absolute;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 480px;
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .slider-container { display: flex; flex-direction: column; gap: 8px; }
    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent-muted);
    }

    .slider-value {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--accent);
    }

    .scrubber-track {
      position: relative;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
    }

    .scrubber-progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: #ffffff;
      border-radius: 3px;
      pointer-events: none;
      transition: width 0.05s linear;
    }

    .native-slider {
      position: absolute;
      inset: -8px 0;
      width: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 5;
    }

    .segmented-control {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .control-item {
      background: transparent;
      border: none;
      border-radius: 12px;
      padding: 9px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--accent-muted);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .control-item svg { width: 18px; height: 18px; stroke-width: 1.75; stroke: currentColor; fill: none; }
    .control-item span { font-size: 11px; font-weight: 500; letter-spacing: -0.01em; }
    .control-item:hover { color: var(--accent); background: rgba(255, 255, 255, 0.06); }
    .control-item.active {
      background: var(--active-bg);
      color: var(--accent-active);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Modal for Pattern */
    .sheet-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .sheet-modal-backdrop.open { display: flex; opacity: 1; }
    .sheet-modal {
      width: 100%;
      max-width: 440px;
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 15px; font-weight: 600; color: var(--accent); }
    .modal-close { background: transparent; border: none; color: var(--accent-muted); cursor: pointer; padding: 4px; }
    .modal-preview {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      background: #000;
    }
    .modal-btn {
      width: 100%;
      padding: 12px;
      background: #ffffff;
      color: #09090b;
      border: none;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    @media (max-width: 768px) {
      .specs-card { display: none; }
      .info-flyout { left: 20px; right: 20px; width: auto; }
      .callout-line { display: none; }
      .callout-tag { left: 16px; top: -14px; }
    }
  </style>
</head>
<body>

  <div class="viewport-container">

    <!-- Top Navigation Header -->
    <header class="top-bar">
      <!-- Model Switcher -->
      <nav class="model-selector glass-panel">
        <button class="selector-tab active" id="tab-engine" onclick="switchModel('engine')">
          <svg viewBox="0 0 24 24" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v18"></path><path d="M3 12h18"></path></svg>
          <span>Turbofan</span>
        </button>
        <button class="selector-tab" id="tab-motor" onclick="switchModel('motor')">
          <svg viewBox="0 0 24 24" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line></svg>
          <span>Robot Motor</span>
        </button>
      </nav>

      <div class="top-actions">
        <!-- Toggle Callout Pins Button -->
        <button class="glass-btn-icon active" id="btn-toggle-hotspots" title="Toggle Part Callouts" onclick="toggleHotspots()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
        </button>

        <!-- Target Pattern Sheet Icon Button -->
        <button class="glass-btn-icon" title="View Target Pattern" onclick="toggleModal(true)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </button>

        <!-- View in AR Pill -->
        <button class="glass-btn-ar" onclick="triggerAR()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8V6a2 2 0 0 1 2-2h2"></path>
            <path d="M4 16v2a2 2 0 0 0 2 2h2"></path>
            <path d="M16 4h2a2 2 0 0 1 2 2v2"></path>
            <path d="M16 20h2a2 2 0 0 0 2-2v-2"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span>View in AR</span>
        </button>
      </div>
    </header>

    <!-- Engineering Technical Specs HUD (Left Panel) -->
    <aside class="specs-card glass-panel" id="specs-card">
      <div class="specs-header">
        <span class="specs-title" id="hud-unit-title">AERO-CORE SPEC</span>
        <div class="specs-status">
          <div class="status-ping"></div>
          <span>LIVE AR</span>
        </div>
      </div>
      <div class="specs-grid" id="hud-specs-list"></div>
    </aside>

    <!-- Part Callout Details Flyout (Right Panel) -->
    <article class="info-flyout glass-panel" id="info-flyout">
      <div class="info-header">
        <div>
          <div class="info-category" id="flyout-tag">COMPONENT</div>
          <div class="info-name" id="flyout-name">Part Name</div>
        </div>
        <button class="info-close" onclick="closeFlyout()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <p class="info-body" id="flyout-desc">Part functional description goes here.</p>
      <div class="info-spec-list" id="flyout-specs"></div>
    </article>

    <!-- 3D & Native AR Viewport -->
    <model-viewer
      id="engine-viewer"
      src="assets/jet_engine.glb"
      animation-name="Explode_Assembly"
      autoplay
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      touch-action="pan-y"
      auto-rotate
      auto-rotate-delay="4000"
      rotation-per-second="8deg"
      shadow-intensity="1.2"
      shadow-softness="0.8"
      exposure="1.15"
      environment-image="neutral"
      alt="Interactive 3D Assembly Model">

      <!-- Direct children with slot="hotspot-..." for Web Component slotting -->
      <!-- Will be populated dynamically via JavaScript directly on <model-viewer> -->

    </model-viewer>

    <!-- Bottom Floating Island Controls -->
    <div class="bottom-island glass-panel">
      <!-- Minimalist Precision Scrubber -->
      <div class="slider-container">
        <div class="slider-header">
          <span id="assembly-label">Turbofan Assembly State</span>
          <span id="slider-percent" class="slider-value">0%</span>
        </div>
        <div class="scrubber-track">
          <div id="scrubber-fill" class="scrubber-progress"></div>
          <input type="range" id="anim-slider" class="native-slider" min="0" max="100" value="0">
        </div>
      </div>

      <!-- Segmented Actions -->
      <nav class="segmented-control">
        <button class="control-item active" id="btn-assemble" onclick="smoothTransitionTo(0)">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
          <span>Assemble</span>
        </button>

        <button class="control-item" id="btn-explode" onclick="smoothTransitionTo(100)">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
          <span>Explode</span>
        </button>

        <button class="control-item" id="btn-play" onclick="togglePlayLoop()">
          <svg id="play-svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span id="play-text">Playback</span>
        </button>

        <button class="control-item" id="btn-reset" onclick="resetCamera()">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6"></path>
            <path d="M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
          </svg>
          <span>Recenter</span>
        </button>
      </nav>
    </div>

  </div>

  <!-- Drawing Target Modal -->
  <div class="sheet-modal-backdrop" id="pattern-modal" onclick="toggleModal(false)">
    <div class="sheet-modal glass-panel" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 class="modal-title">Engineering Target Pattern</h3>
        <button class="modal-close" onclick="toggleModal(false)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <p style="font-size: 13px; color: var(--accent-muted); line-height: 1.4;">
        Print or display this pattern to anchor the 3D model with optical tracking:
      </p>
      <img src="assets/pattern_marker.png" class="modal-preview" alt="Tracking Target Pattern">
      <a href="assets/pattern_marker.png" download="Assembly_Target_Pattern.png" class="modal-btn">Save Printable Pattern</a>
    </div>
  </div>

  <script>
    // Exact 3D coordinates aligned with the model geometry
    const MODEL_DATA = {
      engine: {
        title: "AERO-CORE TURBOFAN",
        specs: [
          { key: "Bypass Ratio", val: "10.5 : 1" },
          { key: "Max Thrust", val: "84,500 lbf" },
          { key: "Fan Diameter", val: "2,050 mm" },
          { key: "Rotor Stages", val: "1 Fan + 8 HPC" },
          { key: "Dry Weight", val: "3,810 kg" },
          { key: "Material", val: "Ti-6Al-4V / Inconel" }
        ],
        hotspots: [
          {
            id: "fan",
            slot: "hotspot-fan",
            pos: "0 1.0 0.35",
            norm: "0 0 1",
            index: "1",
            title: "Fan Rotor",
            tag: "AERODYNAMICS",
            desc: "Titanium alloy forward blades providing 85% of total engine thrust by accelerating mass airflow around the core bypass duct.",
            details: [
              { key: "Blade Count", val: "24 Swept Aerofoils" },
              { key: "Tip Velocity", val: "Mach 1.35" },
              { key: "Impact Rating", val: "FAA 8-lb Bird Strike Certified" }
            ]
          },
          {
            id: "casing",
            slot: "hotspot-casing",
            pos: "1.02 1.0 0",
            norm: "1 0 0",
            index: "2",
            title: "Nacelle Casing",
            tag: "STRUCTURAL",
            desc: "Armored composite and aluminum casing designed to absorb blade-off events and maintain structural containment under high aerodynamic load.",
            details: [
              { key: "Lining", val: "Kevlar Acoustic Treatment" },
              { key: "Acoustic Attenuation", val: "-14 dB EPNL" }
            ]
          },
          {
            id: "core",
            slot: "hotspot-core",
            pos: "0 1.0 -0.85",
            norm: "0 0 -1",
            index: "3",
            title: "Turbine Core",
            tag: "THERMODYNAMICS",
            desc: "Extracts kinetic energy from combusted expansion gases to drive the primary compressor and accessory gearbox.",
            details: [
              { key: "Inlet Temperature", val: "1,650 °C" },
              { key: "Cooling Method", val: "Internal Film & Impingement" },
              { key: "Single-Crystal Alloy", val: "CMSX-4 Superalloy" }
            ]
          },
          {
            id: "cone",
            slot: "hotspot-cone",
            pos: "0 1.0 0.95",
            norm: "0 0 1",
            index: "4",
            title: "Nose Cone",
            tag: "FLOW GUIDANCE",
            desc: "Aerodynamically deflects incoming supersonic airflow into the fan root and sheds ice during adverse meteorological conditions.",
            details: [
              { key: "Geometry", val: "Parabolic Anti-Icing Cone" },
              { key: "Surface Feature", val: "Spiral Ground Warning Stencil" }
            ]
          }
        ]
      },
      motor: {
        title: "FESTO DELTA SERVO",
        specs: [
          { key: "Rated Torque", val: "0.65 Nm" },
          { key: "Peak Speed", val: "6,000 RPM" },
          { key: "Operating Voltage", val: "24 VDC" },
          { key: "Rated Power", val: "230 W" },
          { key: "Enclosure Class", val: "IP65 Rated" },
          { key: "Feedback Encoder", val: "Absolute Multi-turn" }
        ],
        hotspots: [
          {
            id: "motor-body",
            slot: "hotspot-motor-body",
            pos: "0 0.31 0",
            norm: "0 1 0",
            index: "1",
            title: "Stator Housing",
            tag: "ELECTROMAGNETIC",
            desc: "Extruded brushed-iron stator housing enclosing permanent neodymium magnets and concentrated copper windings for delta-robot kinematics.",
            details: [
              { key: "Poles", val: "8-Pole Synchronous AC" },
              { key: "Thermal Sensor", val: "PT1000 Integrated" }
            ]
          },
          {
            id: "damper",
            slot: "hotspot-damper",
            pos: "0 0.31 -0.06",
            norm: "0 0 -1",
            index: "2",
            title: "Vibration Damper",
            tag: "MECHANICAL",
            desc: "Isolates high-frequency robotic delta arm vibrations and prevents torsional harmonic shock from damaging the shaft bearings.",
            details: [
              { key: "Elastomer", val: "Shore 98A Polyurethane" },
              { key: "Backlash", val: "Zero-Backlash Jaw Coupling" }
            ]
          },
          {
            id: "mount",
            slot: "hotspot-mount",
            pos: "0 0.31 0.15",
            norm: "0 0 1",
            index: "3",
            title: "Flange Mount",
            tag: "CHASSIS",
            desc: "Precision CNC-machined anodized aluminum mounting bracket engineered for rigid alignment with the delta robot upper arm pivot.",
            details: [
              { key: "Bolt Pattern", val: "4x M5 PCD 75mm" },
              { key: "Surface", val: "Hard-Anodized MIL-A-8625" }
            ]
          },
          {
            id: "plug",
            slot: "hotspot-plug",
            pos: "0 0.78 -1.02",
            norm: "0 1 0",
            index: "4",
            title: "Quick-Lock Plug",
            tag: "CONNECTIVITY",
            desc: "Heavy-duty 90-degree rotatable M12 industrial connector carrying DC bus power and digital encoder telemetry feedback.",
            details: [
              { key: "Locking", val: "Speedcon Push-Pull" },
              { key: "Gold Pins", val: "50µin Hard Gold Plated" }
            ]
          }
        ]
      }
    };

    const viewer = document.getElementById('engine-viewer');
    const slider = document.getElementById('anim-slider');
    const fill = document.getElementById('scrubber-fill');
    const percentText = document.getElementById('slider-percent');
    const playBtn = document.getElementById('btn-play');
    const playSvg = document.getElementById('play-svg');
    const playText = document.getElementById('play-text');
    const btnAssemble = document.getElementById('btn-assemble');
    const btnExplode = document.getElementById('btn-explode');
    const modal = document.getElementById('pattern-modal');
    const assemblyLabel = document.getElementById('assembly-label');

    const hudTitle = document.getElementById('hud-unit-title');
    const hudList = document.getElementById('hud-specs-list');
    const flyout = document.getElementById('info-flyout');
    const flyoutTag = document.getElementById('flyout-tag');
    const flyoutName = document.getElementById('flyout-name');
    const flyoutDesc = document.getElementById('flyout-desc');
    const flyoutSpecs = document.getElementById('flyout-specs');

    let currentModelType = 'engine';
    let isPlaying = false;
    let autoPlayInterval = null;
    let transitionTimer = null;
    let hotspotsVisible = true;

    // Direct slot mounting on viewer
    renderModelData('engine');

    viewer.addEventListener('load', () => {
      viewer.pause();
      viewer.currentTime = 0;
      updateUI(0);
    });

    function renderModelData(type) {
      const data = MODEL_DATA[type];
      hudTitle.innerText = data.title;

      // Render Specs Sidebar
      hudList.innerHTML = data.specs.map(s => `
        <div class="spec-item">
          <span class="spec-key">${s.key}</span>
          <span class="spec-val">${s.val}</span>
        </div>
      `).join('');

      // Remove existing hotspots directly from viewer children
      const existing = viewer.querySelectorAll('.callout-anchor');
      existing.forEach(e => e.remove());

      // Append new hotspots directly as children of <model-viewer>
      data.hotspots.forEach(h => {
        const btn = document.createElement('button');
        btn.className = 'callout-anchor';
        btn.setAttribute('slot', h.slot);
        btn.setAttribute('data-position', h.pos);
        btn.setAttribute('data-normal', h.norm);
        btn.setAttribute('title', h.title);
        btn.onclick = () => showPartDetails(type, h.id);

        btn.innerHTML = `
          <div class="callout-dot"></div>
          <svg class="callout-line" viewBox="0 0 44 32">
            <polyline points="0,30 20,30 40,4" />
          </svg>
          <div class="callout-tag">
            <span class="callout-num">${h.index}</span>
            <span class="callout-text">${h.title}</span>
          </div>
        `;

        viewer.appendChild(btn);
      });
    }

    function showPartDetails(type, partId) {
      const part = MODEL_DATA[type].hotspots.find(h => h.id === partId);
      if (!part) return;

      flyoutTag.innerText = part.tag;
      flyoutName.innerText = part.title;
      flyoutDesc.innerText = part.desc;
      flyoutSpecs.innerHTML = part.details.map(d => `
        <div class="info-row">
          <span>${d.key}</span>
          <span>${d.val}</span>
        </div>
      `).join('');

      flyout.classList.add('active');
    }

    function closeFlyout() {
      flyout.classList.remove('active');
    }

    function toggleHotspots() {
      hotspotsVisible = !hotspotsVisible;
      const anchors = viewer.querySelectorAll('.callout-anchor');
      anchors.forEach(a => a.style.display = hotspotsVisible ? 'block' : 'none');
      document.getElementById('btn-toggle-hotspots').classList.toggle('active', hotspotsVisible);
      if (!hotspotsVisible) closeFlyout();
    }

    function switchModel(type) {
      if (currentModelType === type) return;
      currentModelType = type;
      if (isPlaying) stopAutoPlay();
      if (transitionTimer) clearInterval(transitionTimer);
      closeFlyout();

      document.getElementById('tab-engine').classList.toggle('active', type === 'engine');
      document.getElementById('tab-motor').classList.toggle('active', type === 'motor');

      renderModelData(type);

      const ts = Date.now();
      const newSrc = (type === 'engine') ? `assets/jet_engine.glb?v=${ts}` : `assets/robot_motor.glb?v=${ts}`;
      assemblyLabel.innerText = (type === 'engine') ? 'Turbofan Assembly State' : 'Robot Drive Motor Assembly State';

      viewer.removeAttribute('src');
      setTimeout(() => {
        viewer.setAttribute('src', newSrc);
      }, 50);

      const onModelLoad = () => {
        viewer.removeEventListener('load', onModelLoad);
        viewer.pause();
        viewer.currentTime = 0;
        resetCamera();
        updateUI(0);
      };
      viewer.addEventListener('load', onModelLoad);
    }

    slider.addEventListener('input', (e) => {
      if (isPlaying) stopAutoPlay();
      if (transitionTimer) clearInterval(transitionTimer);
      const val = parseFloat(e.target.value);
      seekToPercent(val);
    });

    function seekToPercent(percent) {
      updateUI(percent);
      const targetTime = 0.83 + (percent / 100.0) * (2.16 - 0.83);
      viewer.currentTime = (percent === 0) ? 0.0 : targetTime;
    }

    function updateUI(percent) {
      slider.value = percent;
      fill.style.width = percent + '%';
      percentText.innerText = Math.round(percent) + '%';

      if (percent < 8) {
        btnAssemble.classList.add('active');
        btnExplode.classList.remove('active');
      } else if (percent > 92) {
        btnExplode.classList.add('active');
        btnAssemble.classList.remove('active');
      } else {
        btnAssemble.classList.remove('active');
        btnExplode.classList.remove('active');
      }
    }

    function smoothTransitionTo(targetPercent) {
      if (isPlaying) stopAutoPlay();
      if (transitionTimer) clearInterval(transitionTimer);

      let current = parseFloat(slider.value);
      const step = (targetPercent > current) ? 2.5 : -2.5;

      transitionTimer = setInterval(() => {
        current += step;
        if ((step > 0 && current >= targetPercent) || (step < 0 && current <= targetPercent)) {
          current = targetPercent;
          clearInterval(transitionTimer);
        }
        seekToPercent(current);
      }, 16);
    }

    function togglePlayLoop() {
      if (isPlaying) stopAutoPlay();
      else startAutoPlay();
    }

    function startAutoPlay() {
      if (transitionTimer) clearInterval(transitionTimer);
      isPlaying = true;
      viewer.play();
      playText.innerText = 'Pause';
      playBtn.classList.add('active');
      playSvg.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';

      autoPlayInterval = setInterval(() => {
        const t = viewer.currentTime;
        let p = 0;
        if (t <= 0.83) p = 0;
        else if (t <= 2.16) p = ((t - 0.83) / (2.16 - 0.83)) * 100;
        else if (t <= 2.83) p = 100;
        else if (t <= 3.83) p = 100 - (((t - 2.83) / (3.83 - 2.83)) * 100);
        else p = 0;

        p = Math.max(0, Math.min(100, p));
        slider.value = p;
        fill.style.width = p + '%';
        percentText.innerText = Math.round(p) + '%';
      }, 33);
    }

    function stopAutoPlay() {
      isPlaying = false;
      viewer.pause();
      playText.innerText = 'Playback';
      playBtn.classList.remove('active');
      playSvg.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
      if (autoPlayInterval) clearInterval(autoPlayInterval);
    }

    function resetCamera() {
      viewer.cameraOrbit = '45deg 75deg 105%';
      viewer.cameraTarget = 'auto auto auto';
    }

    function triggerAR() {
      if (viewer.canActivateAR) {
        viewer.activateAR();
      } else {
        alert("Launch AR on iOS Safari or Android Chrome to project the model onto any physical surface.");
      }
    }

    function toggleModal(show) {
      if (show) modal.classList.add('open');
      else modal.classList.remove('open');
    }
  </script>
</body>
</html>
