<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AeroCore & Festo AR Suite - Interactive Engineering Data</title>
  <!-- Google model-viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    :root {
      --glass-bg: rgba(20, 20, 24, 0.78);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-border-hover: rgba(255, 255, 255, 0.3);
      --accent: #f5f5f7;
      --accent-muted: #94a3b8;
      --accent-active: #ffffff;
      --active-bg: rgba(255, 255, 255, 0.18);
      --blur: blur(28px) saturate(190%);
      --radius-lg: 24px;
      --radius-md: 14px;
      --cyan: #38bdf8;
      --neon-blue: #00f0ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #09090b;
      color: #ededed;
    }

    .viewport-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 35%, #18181f 0%, #09090b 100%);
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      outline: none;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--glass-border);
      box-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.45), inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
    }

    /* Top Navigation Bar */
    .top-bar {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }

    .model-selector {
      pointer-events: auto;
      border-radius: var(--radius-lg);
      padding: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .selector-tab {
      background: transparent;
      border: none;
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--accent-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .selector-tab svg { width: 14px; height: 14px; stroke: currentColor; fill: none; }
    .selector-tab:hover { color: var(--accent); }
    .selector-tab.active {
      background: var(--active-bg);
      color: var(--accent-active);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .glass-btn-icon {
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-btn-icon:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--glass-border-hover);
      transform: scale(1.04);
    }

    .glass-btn-icon.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    .glass-btn-ar {
      border-radius: 24px;
      padding: 0 18px;
      height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--accent);
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-btn-ar:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--glass-border-hover);
      transform: scale(1.02);
    }

    /* Left Specs HUD Card */
    .specs-card {
      position: absolute;
      top: 80px;
      left: 20px;
      width: 250px;
      border-radius: 18px;
      padding: 16px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: opacity 0.3s ease;
    }

    .specs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 8px;
    }

    .specs-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #38bdf8;
    }

    .specs-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 500;
      color: #34d399;
    }

    .status-ping {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
    }

    .specs-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .spec-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
    }

    .spec-key { color: var(--accent-muted); font-size: 11px; }
    .spec-val { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }

    /* ========================================================
       --- FUTURISTIC 3D MOTION GRAPHICS & GLOWING ARROWS ---
       ======================================================== */
    .motion-indicator {
      pointer-events: none;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 5;
    }

    /* Keep motion graphics visible from all viewing angles without facingCamera culling */
    .motion-indicator[data-visibility-attribute] {
      opacity: 1 !important;
    }

    .stream-arrow-container {
      display: flex;
      align-items: center;
      gap: 8px;
      filter: drop-shadow(0 0 14px rgba(0, 240, 255, 0.95));
    }

    .stream-forward { transform: rotate(0deg); }
    .stream-backward { transform: rotate(180deg); }

    .glow-chevron {
      width: 18px;
      height: 26px;
      fill: none;
      stroke: var(--neon-blue);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.35;
      animation: chevronPulse 1.2s infinite ease-in-out;
    }

    .glow-chevron:nth-child(1) { animation-delay: 0s; }
    .glow-chevron:nth-child(2) { animation-delay: 0.2s; }
    .glow-chevron:nth-child(3) { animation-delay: 0.4s; }

    @keyframes chevronPulse {
      0% { opacity: 0.3; transform: translateX(0); }
      50% { opacity: 1; transform: translateX(6px); filter: drop-shadow(0 0 10px #00f0ff); }
      100% { opacity: 0.3; transform: translateX(0); }
    }

    .rotation-ring-container {
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .rotating-svg-ring {
      width: 100%;
      height: 100%;
      animation: spinRing 2.6s linear infinite;
      filter: drop-shadow(0 0 16px rgba(0, 240, 255, 0.9));
    }

    @keyframes spinRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .vector-label {
      position: absolute;
      background: rgba(15, 23, 42, 0.94);
      border: 1.5px solid var(--neon-blue);
      color: var(--neon-blue);
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 6px;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.6);
      white-space: nowrap;
      top: -24px;
    }

    /* ========================================================
       --- MINIMALIST 3D BULLETS (PINS ONLY BY DEFAULT) ---
       ======================================================== */
    .callout-anchor {
      position: relative;
      cursor: pointer;
      display: block;
      outline: none;
      border: none;
      background: transparent;
      padding: 0;
      pointer-events: auto;
      z-index: 10;
    }

    /* Minimal circular bullet with numbered core & radar ripple */
    .callout-bullet-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .callout-bullet-btn::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1.5px solid rgba(56, 189, 248, 0.6);
      animation: bulletRipple 2.2s infinite ease-out;
      pointer-events: none;
    }

    @keyframes bulletRipple {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .callout-anchor:hover .callout-bullet-btn,
    .callout-anchor.active .callout-bullet-btn {
      background: #38bdf8;
      color: #09090b;
      transform: scale(1.15);
      box-shadow: 0 0 20px #38bdf8, 0 0 32px rgba(56, 189, 248, 0.8);
    }

    /* ========================================================
       --- REVEALED CALLOUT LEADER LINE & INFO CARD ---
       ======================================================== */
    /* Hidden by default: only appears when bullet is clicked (.active) */
    .callout-expanded-group {
      display: none;
      position: absolute;
      top: -30px;
      left: 14px;
      pointer-events: none;
      animation: revealCallout 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .callout-anchor.active .callout-expanded-group {
      display: block;
      pointer-events: auto;
    }

    @keyframes revealCallout {
      0% { opacity: 0; transform: scale(0.9) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Technical connecting leader line */
    .callout-leader-line {
      position: absolute;
      top: 26px;
      left: 0px;
      width: 44px;
      height: 34px;
      pointer-events: none;
      stroke: #38bdf8;
      stroke-width: 2;
      fill: none;
      filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.7));
    }

    /* Attached Info Card Dropdown */
    .callout-info-card {
      position: absolute;
      top: -46px;
      left: 44px;
      width: 285px;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1.5px solid rgba(56, 189, 248, 0.6);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.8), 0 0 24px rgba(56, 189, 248, 0.35);
      cursor: default;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 100;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    .card-tag {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 2px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }

    .card-close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .card-close-btn:hover {
      background: #38bdf8;
      color: #09090b;
    }

    .card-desc {
      font-size: 11px;
      line-height: 1.55;
      color: #cbd5e1;
    }

    .card-specs-grid {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: rgba(0, 0, 0, 0.35);
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card-spec-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
    }

    .card-spec-row span:first-child { color: var(--accent-muted); }
    .card-spec-row span:last-child { color: #f8fafc; font-weight: 600; }

    /* Bottom Control Floating Island */
    .bottom-island {
      position: absolute;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 480px;
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .slider-container { display: flex; flex-direction: column; gap: 8px; }
    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent-muted);
    }

    .slider-value {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      color: var(--accent);
    }

    .scrubber-track {
      position: relative;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
    }

    .scrubber-progress {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: #ffffff;
      border-radius: 3px;
      pointer-events: none;
      transition: width 0.05s linear;
    }

    .native-slider {
      position: absolute;
      inset: -8px 0;
      width: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 5;
    }

    .segmented-control {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .control-item {
      background: transparent;
      border: none;
      border-radius: 12px;
      padding: 9px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--accent-muted);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .control-item svg { width: 18px; height: 18px; stroke-width: 1.75; stroke: currentColor; fill: none; }
    .control-item span { font-size: 11px; font-weight: 500; letter-spacing: -0.01em; }
    .control-item:hover { color: var(--accent); background: rgba(255, 255, 255, 0.06); }
    .control-item.active {
      background: var(--active-bg);
      color: var(--accent-active);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Modal for Pattern */
    .sheet-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .sheet-modal-backdrop.open { display: flex; opacity: 1; }
    .sheet-modal {
      width: 100%;
      max-width: 440px;
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 15px; font-weight: 600; color: var(--accent); }
    .modal-close { background: transparent; border: none; color: var(--accent-muted); cursor: pointer; padding: 4px; }
    .modal-preview {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      background: #000;
    }
    .modal-btn {
      width: 100%;
      padding: 12px;
      background: #ffffff;
      color: #09090b;
      border: none;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    @media (max-width: 768px) {
      .specs-card { display: none; }
      .callout-leader-line { display: none; }
      .callout-info-card { left: -110px; width: 250px; top: 38px; }
    }
  </style>
</head>
<body>

  <div class="viewport-container">

    <!-- Top Navigation Header -->
    <header class="top-bar">
      <!-- Model Switcher -->
      <nav class="model-selector glass-panel">
        <button class="selector-tab active" id="tab-engine" onclick="switchModel('engine')">
          <svg viewBox="0 0 24 24" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v18"></path><path d="M3 12h18"></path></svg>
          <span>Turbofan</span>
        </button>
        <button class="selector-tab" id="tab-motor" onclick="switchModel('motor')">
          <svg viewBox="0 0 24 24" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line></svg>
          <span>Robot Motor</span>
        </button>
      </nav>

      <div class="top-actions">
        <!-- Toggle Motion Graphics VFX Button -->
        <button class="glass-btn-icon active" id="btn-toggle-vfx" title="Toggle Motion Vectors & Arrows" onclick="toggleMotionGraphics()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
            <polyline points="17 6 23 6 23 12"></polyline>
          </svg>
        </button>

        <!-- Toggle Callout Bullets Button -->
        <button class="glass-btn-icon active" id="btn-toggle-hotspots" title="Toggle Part Bullets" onclick="toggleHotspots()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
        </button>

        <!-- Target Pattern Sheet Icon Button -->
        <button class="glass-btn-icon" title="View Target Pattern" onclick="toggleModal(true)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </button>

        <!-- View in AR Pill -->
        <button class="glass-btn-ar" onclick="triggerAR()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8V6a2 2 0 0 1 2-2h2"></path>
            <path d="M4 16v2a2 2 0 0 0 2 2h2"></path>
            <path d="M16 4h2a2 2 0 0 1 2 2v2"></path>
            <path d="M16 20h2a2 2 0 0 0 2-2v-2"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span>View in AR</span>
        </button>
      </div>
    </header>

    <!-- Engineering Technical Specs HUD (Left Panel) -->
    <aside class="specs-card glass-panel" id="specs-card">
      <div class="specs-header">
        <span class="specs-title" id="hud-unit-title">AERO-CORE SPEC</span>
        <div class="specs-status">
          <div class="status-ping"></div>
          <span>LIVE AR</span>
        </div>
      </div>
      <div class="specs-grid" id="hud-specs-list"></div>
    </aside>

    <!-- 3D & Native AR Viewport -->
    <model-viewer
      id="engine-viewer"
      src="assets/jet_engine.glb"
      animation-name="Explode_Assembly"
      autoplay
      ar
      ar-modes="webxr scene-viewer quick-look"
      camera-controls
      touch-action="pan-y"
      auto-rotate
      auto-rotate-delay="4000"
      rotation-per-second="8deg"
      shadow-intensity="1.2"
      shadow-softness="0.8"
      exposure="1.15"
      environment-image="neutral"
      alt="Interactive 3D Assembly Model">

      <!-- Direct children with slot="hotspot-..." for Web Component slotting -->

    </model-viewer>

    <!-- Bottom Floating Island Controls -->
    <div class="bottom-island glass-panel">
      <!-- Minimalist Precision Scrubber -->
      <div class="slider-container">
        <div class="slider-header">
          <span id="assembly-label">Turbofan Assembly State</span>
          <span id="slider-percent" class="slider-value">0%</span>
        </div>
        <div class="scrubber-track">
          <div id="scrubber-fill" class="scrubber-progress"></div>
          <input type="range" id="anim-slider" class="native-slider" min="0" max="100" value="0">
        </div>
      </div>

      <!-- Segmented Actions -->
      <nav class="segmented-control">
        <button class="control-item active" id="btn-assemble" onclick="smoothTransitionTo(0)">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
          <span>Assemble</span>
        </button>

        <button class="control-item" id="btn-explode" onclick="smoothTransitionTo(100)">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"></polyline>
            <polyline points="9 21 3 21 3 15"></polyline>
            <line x1="21" y1="3" x2="14" y2="10"></line>
            <line x1="3" y1="21" x2="10" y2="14"></line>
          </svg>
          <span>Explode</span>
        </button>

        <button class="control-item" id="btn-play" onclick="togglePlayLoop()">
          <svg id="play-svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span id="play-text">Playback</span>
        </button>

        <button class="control-item" id="btn-reset" onclick="resetCamera()">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6"></path>
            <path d="M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
          </svg>
          <span>Recenter</span>
        </button>
      </nav>
    </div>

  </div>

  <!-- Drawing Target Modal -->
  <div class="sheet-modal-backdrop" id="pattern-modal" onclick="toggleModal(false)">
    <div class="sheet-modal glass-panel" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 class="modal-title">Engineering Target Pattern</h3>
        <button class="modal-close" onclick="toggleModal(false)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <p style="font-size: 13px; color: var(--accent-muted); line-height: 1.4;">
        Print or display this pattern to anchor the 3D model with optical tracking:
      </p>
      <img src="assets/pattern_marker.png" class="modal-preview" alt="Tracking Target Pattern">
      <a href="assets/pattern_marker.png" download="Assembly_Target_Pattern.png" class="modal-btn">Save Printable Pattern</a>
    </div>
  </div>

  <script>
    const MODEL_DATA = {
      engine: {
        title: "AERO-CORE TURBOFAN",
        specs: [
          { key: "Bypass Ratio", val: "10.5 : 1" },
          { key: "Max Thrust", val: "84,500 lbf" },
          { key: "Fan Diameter", val: "2,050 mm" },
          { key: "Rotor Stages", val: "1 Fan + 8 HPC" },
          { key: "Dry Weight", val: "3,810 kg" },
          { key: "Material", val: "Ti-6Al-4V / Inconel" }
        ],
        hotspots: [
          {
            id: "fan",
            slot: "hotspot-fan",
            pos: "0.22 1.45 0.72",
            norm: "0 0.8 0.6",
            index: "1",
            title: "Fan Rotor",
            tag: "AERODYNAMICS",
            desc: "Titanium alloy forward blades providing 85% of total engine thrust by accelerating mass airflow around the core bypass duct.",
            details: [
              { key: "Blade Count", val: "24 Swept Aerofoils" },
              { key: "Tip Velocity", val: "Mach 1.35" },
              { key: "Impact Rating", val: "FAA Bird Strike Certified" }
            ]
          },
          {
            id: "casing",
            slot: "hotspot-casing",
            pos: "1.01 1.0 -0.2",
            norm: "1 0 0",
            index: "2",
            title: "Nacelle Casing",
            tag: "STRUCTURAL",
            desc: "Armored composite and aluminum casing designed to absorb blade-off events and maintain structural containment under aerodynamic load.",
            details: [
              { key: "Lining", val: "Kevlar Acoustic Treatment" },
              { key: "Acoustic Attenuation", val: "-14 dB EPNL" }
            ]
          },
          {
            id: "core",
            slot: "hotspot-core",
            pos: "0 1.45 -1.15",
            norm: "0 0.7 -0.7",
            index: "3",
            title: "Turbine Core",
            tag: "THERMODYNAMICS",
            desc: "Extracts kinetic energy from combusted expansion gases to drive the primary compressor and accessory gearbox.",
            details: [
              { key: "Inlet Temp", val: "1,650 °C" },
              { key: "Cooling", val: "Internal Film & Impingement" },
              { key: "Superalloy", val: "CMSX-4 Single-Crystal" }
            ]
          },
          {
            id: "cone",
            slot: "hotspot-cone",
            pos: "0 1.15 1.18",
            norm: "0 0.4 0.9",
            index: "4",
            title: "Nose Cone",
            tag: "FLOW GUIDANCE",
            desc: "Aerodynamically deflects incoming supersonic airflow into the fan root and sheds ice during adverse meteorological conditions.",
            details: [
              { key: "Geometry", val: "Parabolic Anti-Icing Cone" },
              { key: "Feature", val: "Spiral Warning Stencil" }
            ]
          }
        ],
        motionGraphics: [
          {
            slot: "hotspot-vfx-rotation",
            pos: "0 1.0 1.0",
            norm: "0 0 1",
            type: "rotation",
            label: "CW ROTATION • 3,200 RPM"
          },
          {
            slot: "hotspot-vfx-core-thrust",
            pos: "0 1.0 -2.4",
            norm: "0 0 -1",
            type: "stream",
            dir: "forward",
            label: "EXHAUST PLUME VECTOR"
          },
          {
            slot: "hotspot-vfx-intake-vector",
            pos: "0 1.0 1.6",
            norm: "0 0 1",
            type: "stream",
            dir: "forward",
            label: "AIR MASS INFLOW"
          }
        ]
      },
      motor: {
        title: "FESTO DELTA SERVO",
        specs: [
          { key: "Rated Torque", val: "0.65 Nm" },
          { key: "Peak Speed", val: "6,000 RPM" },
          { key: "Operating Voltage", val: "24 VDC" },
          { key: "Rated Power", val: "230 W" },
          { key: "Enclosure Class", val: "IP65 Rated" },
          { key: "Feedback Encoder", val: "Absolute Multi-turn" }
        ],
        hotspots: [
          {
            id: "motor-body",
            slot: "hotspot-motor-body",
            pos: "0 0.31 0",
            norm: "0 1 0",
            index: "1",
            title: "Stator Housing",
            tag: "ELECTROMAGNETIC",
            desc: "Extruded brushed-iron stator housing enclosing permanent neodymium magnets and concentrated copper windings for delta kinematics.",
            details: [
              { key: "Poles", val: "8-Pole Synchronous AC" },
              { key: "Thermal Sensor", val: "PT1000 Integrated" }
            ]
          },
          {
            id: "damper",
            slot: "hotspot-damper",
            pos: "0 0.31 -0.06",
            norm: "0 0 -1",
            index: "2",
            title: "Vibration Damper",
            tag: "MECHANICAL",
            desc: "Isolates high-frequency robotic delta arm vibrations and prevents torsional harmonic shock from damaging the shaft bearings.",
            details: [
              { key: "Elastomer", val: "Shore 98A Polyurethane" },
              { key: "Backlash", val: "Zero-Backlash Jaw Coupling" }
            ]
          },
          {
            id: "mount",
            slot: "hotspot-mount",
            pos: "0 0.31 0.15",
            norm: "0 0 1",
            index: "3",
            title: "Flange Mount",
            tag: "CHASSIS",
            desc: "Precision CNC-machined anodized aluminum mounting bracket engineered for rigid alignment with the delta robot upper arm pivot.",
            details: [
              { key: "Bolt Pattern", val: "4x M5 PCD 75mm" },
              { key: "Surface", val: "Hard-Anodized MIL-A-8625" }
            ]
          },
          {
            id: "plug",
            slot: "hotspot-plug",
            pos: "0 0.78 -1.02",
            norm: "0 1 0",
            index: "4",
            title: "Quick-Lock Plug",
            tag: "CONNECTIVITY",
            desc: "Heavy-duty 90-degree rotatable M12 industrial connector carrying DC bus power and digital encoder telemetry feedback.",
            details: [
              { key: "Locking", val: "Speedcon Push-Pull" },
              { key: "Gold Pins", val: "50µin Hard Gold Plated" }
            ]
          }
        ],
        motionGraphics: [
          {
            slot: "hotspot-vfx-shaft-rotation",
            pos: "0 0.31 0.45",
            norm: "0 0 1",
            type: "rotation",
            label: "SHAFT DYNAMICS • 6,000 RPM"
          },
          {
            slot: "hotspot-vfx-explode-vector",
            pos: "0 0.31 -0.4",
            norm: "0 0 -1",
            type: "stream",
            dir: "forward",
            label: "ASSEMBLY EXTRACTION AXIS"
          }
        ]
      }
    };

    const viewer = document.getElementById('engine-viewer');
    const slider = document.getElementById('anim-slider');
    const fill = document.getElementById('scrubber-fill');
    const percentText = document.getElementById('slider-percent');
    const playBtn = document.getElementById('btn-play');
    const playSvg = document.getElementById('play-svg');
    const playText = document.getElementById('play-text');
    const btnAssemble = document.getElementById('btn-assemble');
    const btnExplode = document.getElementById('btn-explode');
    const modal = document.getElementById('pattern-modal');
    const assemblyLabel = document.getElementById('assembly-label');

    const hudTitle = document.getElementById('hud-unit-title');
    const hudList = document.getElementById('hud-specs-list');

    let currentModelType = 'engine';
    let isPlaying = false;
    let autoPlayInterval = null;
    let transitionTimer = null;
    let hotspotsVisible = true;
    let motionVfxVisible = true;

    renderModelData('engine');

    viewer.addEventListener('load', () => {
      viewer.pause();
      viewer.currentTime = 0;
      updateUI(0);
    });

    function renderModelData(type) {
      const data = MODEL_DATA[type];
      hudTitle.innerText = data.title;

      // Render Left Specs HUD
      hudList.innerHTML = data.specs.map(s => `
        <div class="spec-item">
          <span class="spec-key">${s.key}</span>
          <span class="spec-val">${s.val}</span>
        </div>
      `).join('');

      // Remove existing 3D elements
      const existing = viewer.querySelectorAll('.callout-anchor, .motion-indicator');
      existing.forEach(e => e.remove());

      // 1. Append Interactive Callouts (PINS ONLY BY DEFAULT)
      data.hotspots.forEach(h => {
        const div = document.createElement('div');
        div.className = 'callout-anchor';
        div.id = `anchor-${h.id}`;
        div.setAttribute('slot', h.slot);
        div.setAttribute('data-position', h.pos);
        div.setAttribute('data-normal', h.norm);

        div.innerHTML = `
          <!-- Minimal Bullet on Part Surface -->
          <div class="callout-bullet-btn" onclick="toggleCalloutPin('${h.id}', event)" title="Inspect ${h.title}">
            ${h.index}
          </div>

          <!-- Extended Callout Leader Line & Info Card (Revealed ONLY on Click) -->
          <div class="callout-expanded-group" onclick="event.stopPropagation()">
            <svg class="callout-leader-line" viewBox="0 0 44 34">
              <polyline points="0,32 18,32 42,4" />
            </svg>
            <div class="callout-info-card">
              <div class="card-header">
                <div>
                  <div class="card-tag">${h.tag}</div>
                  <div class="card-title">${h.title}</div>
                </div>
                <button class="card-close-btn" onclick="closeAllCallouts(event)">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
              </div>
              <p class="card-desc">${h.desc}</p>
              <div class="card-specs-grid">
                ${h.details.map(d => `
                  <div class="card-spec-row">
                    <span>${d.key}</span>
                    <span>${d.val}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
        viewer.appendChild(div);
      });

      // 2. Append Glowing Motion Graphics Vectors
      if (data.motionGraphics) {
        data.motionGraphics.forEach(mg => {
          const vfx = document.createElement('div');
          vfx.className = 'motion-indicator';
          vfx.setAttribute('slot', mg.slot);
          vfx.setAttribute('data-position', mg.pos);
          vfx.setAttribute('data-normal', mg.norm);

          if (mg.type === 'rotation') {
            vfx.innerHTML = `
              <div class="rotation-ring-container">
                <span class="vector-label">${mg.label}</span>
                <svg class="rotating-svg-ring" viewBox="0 0 100 100">
                  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" stroke-dasharray="4 4" />
                  <path d="M 50,8 A 42,42 0 0,1 92,50" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
                  <polygon points="90,46 98,54 86,58" fill="#00f0ff" />
                  <path d="M 50,92 A 42,42 0 0,1 8,50" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
                  <polygon points="10,54 2,46 14,42" fill="#00f0ff" />
                </svg>
              </div>
            `;
          } else if (mg.type === 'stream') {
            vfx.innerHTML = `
              <div style="position:relative; display:flex; flex-direction:column; align-items:center;">
                <span class="vector-label" style="top:-22px;">${mg.label}</span>
                <div class="stream-arrow-container stream-${mg.dir}">
                  <svg class="glow-chevron" viewBox="0 0 14 20"><polyline points="2,2 10,10 2,18" /></svg>
                  <svg class="glow-chevron" viewBox="0 0 14 20"><polyline points="2,2 10,10 2,18" /></svg>
                  <svg class="glow-chevron" viewBox="0 0 14 20"><polyline points="2,2 10,10 2,18" /></svg>
                </div>
              </div>
            `;
          }
          viewer.appendChild(vfx);
        });
      }
    }

    function toggleCalloutPin(id, e) {
      if (e) e.stopPropagation();
      const anchor = document.getElementById(`anchor-${id}`);
      if (!anchor) return;

      const isAlreadyActive = anchor.classList.contains('active');
      closeAllCallouts();

      if (!isAlreadyActive) {
        anchor.classList.add('active');
      }
    }

    function closeAllCallouts(e) {
      if (e) e.stopPropagation();
      const anchors = viewer.querySelectorAll('.callout-anchor');
      anchors.forEach(a => a.classList.remove('active'));
    }

    viewer.addEventListener('click', (e) => {
      if (!e.target.closest('.callout-anchor')) {
        closeAllCallouts();
      }
    });

    function toggleHotspots() {
      hotspotsVisible = !hotspotsVisible;
      const anchors = viewer.querySelectorAll('.callout-anchor');
      anchors.forEach(a => a.style.display = hotspotsVisible ? 'block' : 'none');
      document.getElementById('btn-toggle-hotspots').classList.toggle('active', hotspotsVisible);
      if (!hotspotsVisible) closeAllCallouts();
    }

    function toggleMotionGraphics() {
      motionVfxVisible = !motionVfxVisible;
      const vfxElements = viewer.querySelectorAll('.motion-indicator');
      vfxElements.forEach(el => el.style.display = motionVfxVisible ? 'flex' : 'none');
      document.getElementById('btn-toggle-vfx').classList.toggle('active', motionVfxVisible);
    }

    function switchModel(type) {
      if (currentModelType === type) return;
      currentModelType = type;
      if (isPlaying) stopAutoPlay();
      if (transitionTimer) clearInterval(transitionTimer);
      closeAllCallouts();

      document.getElementById('tab-engine').classList.toggle('active', type === 'engine');
      document.getElementById('tab-motor').classList.toggle('active', type === 'motor');

      renderModelData(type);

      const ts = Date.now();
      const newSrc = (type === 'engine') ? `assets/jet_engine.glb?v=${ts}` : `assets/robot_motor.glb?v=${ts}`;
      assemblyLabel.innerText = (type === 'engine') ? 'Turbofan Assembly State' : 'Robot Drive Motor Assembly State';

      viewer.removeAttribute('src');
      setTimeout(() => {
        viewer.setAttribute('src', newSrc);
      }, 50);

      const onModelLoad = () => {
        viewer.removeEventListener('load', onModelLoad);
        viewer.pause();
        viewer.currentTime = 0;
        resetCamera();
        updateUI(0);
      };
      viewer.addEventListener('load', onModelLoad);
    }

    slider.addEventListener('input', (e) => {
      if (isPlaying) stopAutoPlay();
      if (transitionTimer) clearInterval(transitionTimer);
      const val = parseFloat(e.target.value);
      seekToPercent(val);
    });

    function seekToPercent(percent) {
      updateUI(percent);
      const targetTime = 0.83 + (percent / 100.0) * (2.16 - 0.83);
      viewer.currentTime = (percent === 0) ? 0.0 : targetTime;
    }

    function updateUI(percent) {
      slider.value = percent;
      fill.style.width = percent + '%';
      percentText.innerText = Math.round(percent) + '%';

      if (percent < 8) {
        btnAssemble.classList.add('active');
        btnExplode.classList.remove('active');
      } else if (percent > 92) {
        btnExplode.classList.add('active');
        btnAssemble.classList.remove('active');
      } else {
        btnAssemble.classList.remove('active');
        btnExplode.classList.remove('active');
      }
    }

    function smoothTransitionTo(targetPercent) {
      if (isPlaying) stopAutoPlay();
      if (transitionTimer) clearInterval(transitionTimer);

      let current = parseFloat(slider.value);
      const step = (targetPercent > current) ? 2.5 : -2.5;

      transitionTimer = setInterval(() => {
        current += step;
        if ((step > 0 && current >= targetPercent) || (step < 0 && current <= targetPercent)) {
          current = targetPercent;
          clearInterval(transitionTimer);
        }
        seekToPercent(current);
      }, 16);
    }

    function togglePlayLoop() {
      if (isPlaying) stopAutoPlay();
      else startAutoPlay();
    }

    function startAutoPlay() {
      if (transitionTimer) clearInterval(transitionTimer);
      isPlaying = true;
      viewer.play();
      playText.innerText = 'Pause';
      playBtn.classList.add('active');
      playSvg.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';

      autoPlayInterval = setInterval(() => {
        const t = viewer.currentTime;
        let p = 0;
        if (t <= 0.83) p = 0;
        else if (t <= 2.16) p = ((t - 0.83) / (2.16 - 0.83)) * 100;
        else if (t <= 2.83) p = 100;
        else if (t <= 3.83) p = 100 - (((t - 2.83) / (3.83 - 2.83)) * 100);
        else p = 0;

        p = Math.max(0, Math.min(100, p));
        slider.value = p;
        fill.style.width = p + '%';
        percentText.innerText = Math.round(p) + '%';
      }, 33);
    }

    function stopAutoPlay() {
      isPlaying = false;
      viewer.pause();
      playText.innerText = 'Playback';
      playBtn.classList.remove('active');
      playSvg.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
      if (autoPlayInterval) clearInterval(autoPlayInterval);
    }

    function resetCamera() {
      viewer.cameraOrbit = '45deg 75deg 105%';
      viewer.cameraTarget = 'auto auto auto';
    }

    function triggerAR() {
      if (viewer.canActivateAR) {
        viewer.activateAR();
      } else {
        alert("Launch AR on iOS Safari or Android Chrome to project the model onto any physical surface.");
      }
    }

    function toggleModal(show) {
      if (show) modal.classList.add('open');
      else modal.classList.remove('open');
    }
  </script>
</body>
</html>
